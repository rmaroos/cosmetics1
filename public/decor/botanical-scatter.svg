<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Scattered small flowers & leaves, low opacity. Irregular placement in a large
       tile so the repeat isn't noticeable. Elements that cross an edge are mirrored
       on the opposite edge so the tile repeats seamlessly. -->
  <defs>
    <path id="p" d="M32 32 C23 27 19 14 25 8 C31 3 39 10 32 32 Z"/>
    <g id="flower">
      <g stroke="#B39768" stroke-width="1.2" stroke-linejoin="round" fill="#EDE4D5">
        <use href="#p"/>
        <use href="#p" transform="rotate(72 32 32)"/>
        <use href="#p" transform="rotate(144 32 32)"/>
        <use href="#p" transform="rotate(216 32 32)"/>
        <use href="#p" transform="rotate(288 32 32)"/>
      </g>
      <circle cx="32" cy="32" r="4.5" fill="#D9C49C"/>
    </g>
    <g id="leaf" stroke="#9AA596" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C10 -11 30 -12 44 -2 C30 7 11 8 0 0 Z" fill="#78866B" fill-opacity="0.35"/>
      <path d="M3 -0.5 C16 -3 29 -3 40 -2" fill="none"/>
    </g>
    <g id="twig" fill="none" stroke="#9AA596" stroke-width="1.2" stroke-linecap="round">
      <path d="M0 0 C8 -6 16 -10 28 -14"/>
      <use href="#leaf" transform="translate(9 -5) rotate(-75) scale(0.45)"/>
      <use href="#leaf" transform="translate(16 -9) rotate(25) scale(0.45)"/>
      <use href="#leaf" transform="translate(28 -14) rotate(-25) scale(0.5)"/>
    </g>
  </defs>

  <g opacity="0.2">
    <!-- flowers (varied size & rotation) -->
    <use href="#flower" transform="translate(40 52) scale(0.42) rotate(10 32 32)"/>
    <use href="#flower" transform="translate(300 34) scale(0.3) rotate(-24 32 32)"/>
    <use href="#flower" transform="translate(196 186) scale(0.36) rotate(40 32 32)"/>
    <use href="#flower" transform="translate(402 238) scale(0.46) rotate(-8 32 32)"/>
    <use href="#flower" transform="translate(86 330) scale(0.32) rotate(22 32 32)"/>
    <use href="#flower" transform="translate(318 400) scale(0.38) rotate(-36 32 32)"/>
    <use href="#flower" transform="translate(150 438) scale(0.24) rotate(12 32 32)"/>

    <!-- single leaves -->
    <use href="#leaf" transform="translate(132 96) rotate(-32) scale(0.55)"/>
    <use href="#leaf" transform="translate(380 120) rotate(146) scale(0.5)"/>
    <use href="#leaf" transform="translate(262 300) rotate(-120) scale(0.6)"/>
    <use href="#leaf" transform="translate(24 230) rotate(18) scale(0.5)"/>
    <use href="#leaf" transform="translate(420 380) rotate(-62) scale(0.45)"/>

    <!-- small twigs -->
    <use href="#twig" transform="translate(236 104) rotate(-10)"/>
    <use href="#twig" transform="translate(52 170) rotate(200) scale(0.9)"/>
    <use href="#twig" transform="translate(330 196) rotate(60) scale(0.85)"/>
    <use href="#twig" transform="translate(210 380) rotate(-160) scale(0.95)"/>
    <use href="#twig" transform="translate(438 60) rotate(110) scale(0.8)"/>

    <!-- tiny dots / buds -->
    <g fill="#B39768">
      <circle cx="268" cy="228" r="1.6"/>
      <circle cx="118" cy="262" r="1.4"/>
      <circle cx="364" cy="318" r="1.6"/>
      <circle cx="60" cy="410" r="1.4"/>
      <circle cx="446" cy="170" r="1.3"/>
      <circle cx="174" cy="20" r="1.4"/>
      <circle cx="252" cy="456" r="1.3"/>
    </g>
  </g>
</svg>
